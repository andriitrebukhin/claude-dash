name: Firmware

# Builds the display firmware. Pushing a tag like v0.3.0 also publishes a
# GitHub Release with ready-to-flash images.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.13-${{ hashFiles('scripts/build-firmware.sh') }}

      - name: Build
        run: scripts/build-firmware.sh
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: claude-dash-firmware
          path: dist/*

      - name: Build installer site
        run: scripts/build-site.sh
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Flash the display

            **Easiest: one click in Chrome or Edge:** https://andrii.is-a.dev/claude-dash/ installs the firmware and sets up Wi-Fi.

            **Or manually:** download `claude-dash-${{ github.ref_name }}-full.bin`, open https://espressif.github.io/esptool-js/, connect, and program it at `0x0`.

            **Or with esptool:** `esptool --chip esp32s3 write-flash 0x0 claude-dash-${{ github.ref_name }}-full.bin`

            **Updating a display that's already set up?** It updates itself: within a few hours the display shows an **Update to ${{ github.ref_name }}** button (the Mac bridge fetches the release). To update over USB instead, flash `claude-dash-${{ github.ref_name }}-update.bin` at `0xe000`; that keeps Wi-Fi and pairing. The full image erases them.

            `claude-dash-${{ github.ref_name }}-app.bin` is the image the bridge serves for wireless updates.

            Then install the Mac plugin and set up the display as described in the [README](https://github.com/andriitrebukhin/claude-dash#install).

            The images include Waveshare's display/touch drivers and LVGL 8.3, built from Waveshare's demo package for the ESP32-S3-Touch-LCD-2.1.

  # Publishes the browser installer (needs Settings > Pages > Source: GitHub Actions).
  pages:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
